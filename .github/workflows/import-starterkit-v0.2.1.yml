name: Import tested Starter Kit v0.2.1
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-starterkit-v0.2.1.yml]
permissions:
  contents: write
concurrency:
  group: import-starterkit-v0.2.1
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download and verify the published source package
        env:
          SOURCE_ORIGIN: https://linux-handheld-starter-kit.steamdeckchecker.chatgpt.site
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 90 "$SOURCE_ORIGIN/downloads/Linux-Handheld-Starter-Kit-v0.2.1.zip" -o "$RUNNER_TEMP/source-v0.2.1.zip"
          curl -fL --retry 3 --max-time 90 "$SOURCE_ORIGIN/downloads/SHA256SUMS" -o "$RUNNER_TEMP/source-SHA256SUMS"
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, re, stat, zipfile
          temp = Path(os.environ["RUNNER_TEMP"])
          archive = temp / "source-v0.2.1.zip"
          if archive.stat().st_size != 9426053:
              raise SystemExit("Unexpected source package size")
          checksums = (temp / "source-SHA256SUMS").read_text()
          expected = re.findall(r"^([0-9a-f]{64})  Linux-Handheld-Starter-Kit-v0\.2\.1\.zip$", checksums, re.M)
          if len(expected) != 1 or hashlib.sha256(archive.read_bytes()).hexdigest() != expected[0]:
              raise SystemExit("Source package checksum mismatch")
          prefix = "Linux-Handheld-Starter-Kit-v0.2.1/"
          with zipfile.ZipFile(archive) as package:
              if sum(item.file_size for item in package.infolist()) > 64 * 1024**2:
                  raise SystemExit("Source package exceeds size limit")
              for item in package.infolist():
                  if item.is_dir():
                      continue
                  if not item.filename.startswith(prefix):
                      raise SystemExit("Unexpected archive root")
                  relative = PurePosixPath(item.filename[len(prefix):])
                  if relative.is_absolute() or ".." in relative.parts or ".git" in relative.parts or "\\" in str(relative):
                      raise SystemExit("Unsafe archive path")
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit("Symlinks are not supported")
                  target = Path(*relative.parts)
                  data = package.read(item)
                  if relative.parts[0] == ".github":
                      if not target.is_file() or target.read_bytes() != data:
                          raise SystemExit("Published package changes an existing workflow")
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  target.chmod(0o755 if target.suffix in {".sh", ".desktop"} else 0o644)
          if Path("VERSION").read_text().strip() != "0.2.1":
              raise SystemExit("Unexpected installer version")
          plugins = Path("recommend.txt").read_text().splitlines()
          if len(plugins) != 28 or len(set(plugins)) != 28:
              raise SystemExit("Expected 28 distinct recommendations")
          wallpaper = Path("assets/Live_Background_KDE_v0.3.2.zip")
          if hashlib.sha256(wallpaper.read_bytes()).hexdigest() != "b67ce8339ff079784dfdfdbb3e9565da43999a75334d2d9de1ddd2e107aa150d":
              raise SystemExit("Wallpaper differs from the supplied package")
          PY
      - name: Test and reproduce the exact release package
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          mv .github/workflows/import-starterkit-v0.2.1.yml "$RUNNER_TEMP/import-starterkit-v0.2.1.yml"
          trap 'mv "$RUNNER_TEMP/import-starterkit-v0.2.1.yml" .github/workflows/import-starterkit-v0.2.1.yml' EXIT
          sha256sum --check SHA256SUMS
          python3 scripts/package_release.py
          cmp release/Linux-Handheld-Starter-Kit-v0.2.1.zip "$RUNNER_TEMP/source-v0.2.1.zip"
          bash -n install.sh
          sha256sum --check SHA256SUMS
          (cd release && sha256sum --check SHA256SUMS)
          bash website/scripts/build.sh
          node website/scripts/validate-artifact.mjs
          node --test website/tests/worker.test.mjs
      - name: Commit the verified source without overwriting concurrent changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- VERSION starterkit.py recommend.txt build.py install.sh Linux-Handheld-Starter-Kit.desktop SHA256SUMS README.md README.en.md CHANGELOG.md assets docs tests scripts website
          git diff --cached --stat
          git commit -m "Release v0.2.1: 28 plugins, LiveWallpaper 0.3.2 and desktop links"
          gh auth setup-git
          git push origin HEAD:main
          git rev-parse HEAD > "$RUNNER_TEMP/imported-commit"
      - name: Publish the verified v0.2.1 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          commit=$(cat "$RUNNER_TEMP/imported-commit")
          gh release create v0.2.1 --target "$commit" --title "v0.2.1 — Linux Handheld Starter Kit" --notes-file docs/releases/v0.2.1.md --draft
          gh release upload v0.2.1 release/install.sh release/Linux-Handheld-Starter-Kit.desktop release/Linux-Handheld-Starter-Kit-v0.2.1.zip release/Live_Background_KDE_v0.3.2.zip release/SHA256SUMS
          gh release edit v0.2.1 --draft=false --prerelease=false --latest
