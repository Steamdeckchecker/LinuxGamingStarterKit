name: Offline checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
      - run: sha256sum --check SHA256SUMS
  package-and-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/package_release.py
      - run: git diff --exit-code -- install.sh Linux-Handheld-Starter-Kit.desktop SHA256SUMS
      - run: sha256sum --check SHA256SUMS
        working-directory: release
      - run: bash website/scripts/build.sh
      - run: node website/scripts/validate-artifact.mjs
      - run: node --test website/tests/worker.test.mjs
