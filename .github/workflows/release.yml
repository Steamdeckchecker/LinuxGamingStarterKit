name: Publish release

on:
  push:
    branches: [main]
    paths: [VERSION, 'docs/releases/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test and build exact release files
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/package_release.py
          git diff --exit-code -- install.sh Linux-Handheld-Starter-Kit.desktop SHA256SUMS
          (cd release && sha256sum --check SHA256SUMS)
          bash website/scripts/build.sh
          node website/scripts/validate-artifact.mjs
          node --test website/tests/worker.test.mjs
      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$(cat VERSION)"
          notes="docs/releases/$tag.md"
          test -f "$notes"
          if gh release view "$tag" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-draft")" != true ]]; then
              gh release edit "$tag" --notes-file "$notes" --prerelease=false --latest
              echo "Updated published release $tag and marked it as the latest regular release."
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag — Linux Handheld Starter Kit" --notes-file "$notes" --draft
          fi
          gh release upload "$tag" release/install.sh release/Linux-Handheld-Starter-Kit.desktop "release/Linux-Handheld-Starter-Kit-$tag.zip" release/SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --prerelease=false --latest
